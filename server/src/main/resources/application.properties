spring.application.name=CyberTownServer
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:sqlite:${CYBERTOWN_DB_PATH:./cybertown.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys=ON

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

spring.ai.openai.api-key=${DEEPSEEK_API_KEY:local-disabled}
spring.ai.openai.base-url=https://api.deepseek.com
spring.ai.openai.chat.options.model=deepseek-v4-flash
spring.ai.openai.chat.options.max-tokens=600

cybertown.ai.enabled=${CYBERTOWN_AI_ENABLED:false}
cybertown.ai.model=deepseek-v4-flash
cybertown.ai.max-calls-per-resident-day=4
cybertown.ai.monthly-budget-cny=${CYBERTOWN_AI_MONTHLY_BUDGET_CNY:200}
cybertown.ai.input-cost-cny-per-million=1.0
cybertown.ai.output-cost-cny-per-million=2.0

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/api/openapi
springdoc.swagger-ui.path=/api/docs

cybertown.bootstrap-invite-code=${CYBERTOWN_BOOTSTRAP_INVITE_CODE:}
cybertown.bootstrap-invite-codes=${CYBERTOWN_BOOTSTRAP_INVITE_CODES:}
cybertown.town-zone=Asia/Shanghai
cybertown.max-residents=20
